<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navdhya - Offline</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background-color: #fff8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
            color: #1c1917;
        }
        .container {
            max-width: 400px;
            padding: 20px;
            margin: 20px;
        }
        .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            background-color: #0E3F2E;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 36px;
            font-weight: bold;
        }
        h1 {
            color: #0E3F2E;
            margin-bottom: 10px;
            font-size: 28px;
        }
        p {
            color: #666;
            line-height: 1.6;
        }
        .message {
            font-size: 20px;
            color: #d97706;
            font-weight: 600;
            margin: 20px 0;
        }
        .retry-button {
            background-color: #d97706;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            transition: background-color 0.3s;
            font-weight: 500;
        }
        .retry-button:hover {
            background-color: #b45309;
        }
        .description {
            font-size: 16px;
            margin-top: 30px;
            color: #777;
        }
        .connection-status {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 20px;
            color: #881337;
            font-weight: 500;
        }
        .status-indicator {
            width: 12px;
            height: 12px;
            background-color: #881337;
            border-radius: 50%;
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">N</div>
        <h1>Navdhya</h1>
        <p class="message">Your connection might not be available</p>
        <p>You are currently offline. Please check your internet connection and try again.</p>
        <button class="retry-button" onclick="window.location.reload()">Retry Connection</button>
        <div class="connection-status">
            <div class="status-indicator"></div>
            <span>Offline Mode</span>
        </div>
        <p class="description">We're here to help you with authentic Hindu rituals and ceremonies when you're back online.</p>
    </div>
    
    <script>
        // Check for online status and reload when connection is restored
        window.addEventListener('online', () => {
            // Show a message that connection is restored
            const statusElement = document.querySelector('.connection-status');
            if (statusElement) {
                statusElement.innerHTML = '<div class="status-indicator" style="background-color: #10b981;"></div><span>Connection Restored</span>';
                statusElement.style.color = '#10b981';
            }
            
            // Reload the page after a short delay
            setTimeout(() => {
                window.location.reload();
            }, 1500);
        });
        
        // Periodically check connection status
        setInterval(() => {
            fetch('/')
                .then(() => {
                    // If we can fetch, we're online
                    window.location.reload();
                })
                .catch(() => {
                    // Still offline, do nothing
                });
        }, 10000); // Check every 10 seconds
    </script>
</body>
</html>
