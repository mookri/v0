# OpenAPI 3.1 fragment — tenant self-service + identity self-service
# (TEN-006 §4.3 platform-global surfaces). Merged by api:compose.
openapi: 3.1.0
info:
  title: Navdhya Platform — Tenancy & Identity Self-Service
  version: 1.0.0
paths:
  /api/v1/platform/tenants:
    get:
      operationId: listOwnTenantMemberships
      x-gate: ownership
      summary: List the caller's tenant memberships
      responses:
        '200':
          description: Memberships with tenant summaries.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, object, state, tenant]
                      properties:
                        id: { $ref: '#/components/schemas/Ulid' }
                        object: { type: string, enum: [tenant_membership] }
                        state: { type: string, enum: [active, suspended, expired] }
                        tenant:
                          type: object
                          required: [id, slug, name, status]
                          properties:
                            id: { $ref: '#/components/schemas/Ulid' }
                            slug: { type: string }
                            name: { type: string }
                            status: { type: string }
                  meta: { $ref: '#/components/schemas/ListMeta' }
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /api/v1/identity/profile:
    get:
      operationId: getOwnProfile
      x-gate: ownership
      summary: Read the caller's profile.
      responses:
        '200':
          description: Profile.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [id, object, name, email, email_verified]
                    properties:
                      id: { type: integer }
                      object: { type: string, enum: [user_profile] }
                      name: { type: string }
                      email: { type: string, format: email }
                      email_verified: { type: boolean }
                  meta:
                    type: object
                    required: [request_id]
                    properties:
                      request_id: { type: string }
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    patch:
      operationId: updateOwnProfile
      x-gate: ownership
      summary: Update own display name (unknown fields rejected).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 255 }
      responses:
        '200':
          description: Updated profile.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [id, object, name, email, email_verified]
                    properties:
                      id: { type: integer }
                      object: { type: string, enum: [user_profile] }
                      name: { type: string }
                      email: { type: string, format: email }
                      email_verified: { type: boolean }
                  meta:
                    type: object
                    required: [request_id]
                    properties:
                      request_id: { type: string }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /api/v1/identity/sessions:
    get:
      operationId: listOwnSessions
      x-gate: ownership
      summary: List own web sessions with current marker.
      responses:
        '200':
          description: Session inventory.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, object, current]
                      properties:
                        id: { type: string }
                        object: { type: string, enum: [user_session] }
                        current: { type: boolean }
                  meta:
                    type: object
                    required: [request_id]
                    properties:
                      request_id: { type: string }
  /api/v1/identity/sessions:revoke-others:
    post:
      operationId: revokeOtherSessions
      x-gate: ownership
      summary: Revoke all sessions except the current one.
      responses:
        '200':
          description: Revocation count.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [object, revoked]
                    properties:
                      object: { type: string, enum: [session_revocation] }
                      revoked: { type: integer }
                  meta:
                    type: object
                    required: [request_id]
                    properties:
                      request_id: { type: string }
