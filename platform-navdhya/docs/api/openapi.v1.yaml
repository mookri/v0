          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data: { type: array }
                  meta: { $ref: '#/components/schemas/ListMeta' }
        403:
          $ref: '#/components/responses/AuthorizationDenied'
        404:
          $ref: '#/components/responses/NotFound'
    post:
      operationId: placeVendorOrder
      summary: 'Place an order (lines snapshotted; reference unique per vendor).'
      x-gate: ownership
      x-scope: 'vendor:partner'
      parameters:
        -
          $ref: '#/components/parameters/TenantId'
        -
