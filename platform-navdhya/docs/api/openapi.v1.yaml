      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reference
                - items
              properties:
                reference:
                  type: string
                  maxLength: 64
                customer_name:
                  type: string
                  maxLength: 255
                currency:
                  type: string
                  maxLength: 3
                items:
                  type: array
                  minItems: 1
                  items: { type: object, required: [sku, name, quantity, unit_minor], properties: { sku: { type: string, maxLength: 64 }, name: { type: string, maxLength: 255 }, quantity: { type: integer, minimum: 1 }, unit_minor: { type: integer, minimum: 0 } } }
      responses:
        201:
          description: 'New order (status NEW, lines inlined, total_minor computed).'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data: { type: object, required: [id, object, reference, currency, total_minor, status, items], properties: { object: { type: string, enum: [vendor_order] }, status: { type: string, enum: [NEW, PROCESSING, DISPATCHED, DELIVERED, CANCELLED] }, items: { type: array, items: { type: object, required: [id, sku, name, quantity, unit_minor, line_minor] } } } }
                  meta: { type: object, required: [request_id], properties: { request_id: { type: string } } }
        403:
          $ref: '#/components/responses/AuthorizationDenied'
        404:
          $ref: '#/components/responses/NotFound'
        409:
          description: 'conflict — order reference already exists for this vendor.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        422:
          $ref: '#/components/responses/ValidationFailed'
