      x-gate: ownership
      x-scope: 'vendor:partner'
      parameters:
        -
          $ref: '#/components/parameters/TenantId'
        -
          name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Ulid'
        -
          name: itemId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Ulid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 255
                description:
                  type: string
                  maxLength: 2000
                currency:
                  type: string
                  maxLength: 3
                price_minor:
                  type: integer
                  minimum: 0
