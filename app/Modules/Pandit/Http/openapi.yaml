              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /api/v1/pandit/admin/assignments:
    post:
      operationId: adminAssignPandit
      summary: Assign a pandit to a booking (capability pandit:assignment:manage).
      x-permission: pandit:assignment:manage
      x-scope: pandit:admin
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pandit_id, booking_id, compensation_minor]
              properties:
                pandit_id: { type: string, maxLength: 26 }
                booking_id: { type: string, maxLength: 26 }
                compensation_minor: { type: integer, minimum: 0 }
      responses:
        '201':
          description: New assignment (idempotent per pandit + booking).
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [id, status]
                    properties:
                      id: { $ref: '#/components/schemas/Ulid' }
                      status: { type: string, enum: [PENDING, CONFIRMED, DECLINED, COMPLETED, CANCELLED] }
                  meta:
                    type: object
                    required: [request_id]
                    properties:
                      request_id: { type: string }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AuthorizationDenied' }
        '409':
          description: PANDIT_ASSIGNMENT_BOOKING_CONFLICT — the windows overlap an existing assignment of that pandit.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '422':
          description: >-
            validation_failed — unknown ids resolve through ports, not an
            exists rule: details.fields carries booking_id unknown_booking
            or pandit_id unknown_pandit.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /api/v1/pandit/admin/assignments/{id}:
    delete:
      operationId: adminUnassignPandit
      summary: Unassign a pandit from a booking (capability pandit:assignment:manage).
      x-permission: pandit:assignment:manage
      x-scope: pandit:admin
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: id
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Ulid' }
      responses:
        '200':
          description: Assignment removed.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [deleted]
                    properties:
                      deleted: { type: boolean }
                  meta:
                    type: object
                    required: [request_id]
                    properties:
                      request_id: { type: string }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AuthorizationDenied' }
        '404':
          description: PANDIT_ASSIGNMENT_NOT_FOUND — unknown assignment.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
