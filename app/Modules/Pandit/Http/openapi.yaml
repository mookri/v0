        '200':
          description: Suspended profile (drops out of the public directory immediately).
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [id, status]
                    properties:
                      id: { $ref: '#/components/schemas/Ulid' }
                      status: { type: string, enum: [SUSPENDED] }
                  meta:
                    type: object
                    required: [request_id]
                    properties:
                      request_id: { type: string }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AuthorizationDenied' }
        '404':
          description: PANDIT_NOT_FOUND — unknown pandit.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '409':
          description: state_forbidden — the pandit is already suspended.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /api/v1/pandit/admin/profiles/{id}:reactivate:
    post:
      operationId: reactivatePandit
      summary: Reactivate a suspended pandit (capability pandit:profile:manage + step-up level 2).
      x-permission: pandit:profile:manage
      x-scope: pandit:admin
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: id
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Ulid' }
      responses:
        '200':
          description: Reactivated profile.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [id, status]
                    properties:
                      id: { $ref: '#/components/schemas/Ulid' }
                      status: { type: string, enum: [ACTIVE] }
                  meta:
                    type: object
                    required: [request_id]
                    properties:
                      request_id: { type: string }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AuthorizationDenied' }
        '404':
          description: PANDIT_NOT_FOUND — unknown pandit.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '409':
          description: state_forbidden — only a suspended pandit can reactivate (already active is 409).
