# OpenAPI 3.1 fragment — RFC 7009 revocation (client-authenticated, public).
openapi: 3.1.0
info:
  title: Navdhya Platform — Token Revocation
  version: 1.0.0
paths:
  /api/oauth/revoke:
    post:
      operationId: revokeOAuthToken
      summary: Revoke an access or refresh token (unknown tokens 200).
      x-gate: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, client_id, client_secret]
      responses:
        '200':
          description: Revoked (or unknown — no oracle).
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                  meta:
                    type: object
                    required: [request_id]
                    properties:
                      request_id: { type: string }
  /api/oauth/introspect:
    post:
      operationId: introspectOAuthToken
      summary: RFC 7662 introspection (first-party service clients only).
      x-gate: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, client_id, client_secret]
      responses:
        '200':
          description: Active flag with claims, or inactive.
          content:
            application/json:
              schema:
                type: object
                required: [active]
                properties:
                  active: { type: boolean }
