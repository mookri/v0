openapi: 3.1.0
info:
  title: 'Navdhya Platform API'
  version: 1.0.0
paths:
  /api/oauth/introspect:
    post:
      operationId: introspectOAuthToken
      summary: 'RFC 7662 introspection (first-party service clients only).'
      x-gate: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - client_id
                - client_secret
      responses:
        200:
          description: 'Active flag with claims, or inactive.'
          content:
            application/json:
              schema:
                type: object
                required:
                  - active
                properties:
                  active: { type: boolean }
  /api/oauth/revoke:
    post:
      operationId: revokeOAuthToken
      summary: 'Revoke an access or refresh token (unknown tokens 200).'
      x-gate: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - client_id
                - client_secret
      responses:
        200:
          description: 'Revoked (or unknown — no oracle).'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data: { type: object }
                  meta: { type: object, required: [request_id], properties: { request_id: { type: string } } }
  /api/v1/authz/explain:
    get:
      operationId: explainAuthorization
      summary: 'Restricted SEC-022 precedence-chain trace (requires platform:authz:explain)'
      x-permission: 'platform:authz:explain'
      description: "Returns the full chain trace (K-013 AuthorizationDecision) for one membership + capability. Principals are only visible within the caller's own tenant; anything else is 403 authorization_denied (AC-T-0K01-02-4). Evaluation bypasses the decision cache."
      parameters:
        -
          $ref: '#/components/parameters/TenantId'
        -
          name: membership_id
          in: query
          required: true
          schema:
            type: string
        -
          name: capability
          in: query
          required: true
          schema:
            type: string
        -
          name: amount
          in: query
          schema:
            type: number
        -
          name: currency
          in: query
          schema:
            type: string
            pattern: '^[A-Z]{3}$'
        -
          name: org
          in: query
          schema:
            type: string
            maxLength: 64
        -
          name: time
          in: query
          schema:
            type: string
        -
          name: status
          in: query
          schema:
            type: string
            maxLength: 64
      responses:
        200:
          description: 'Full precedence-chain trace'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data: { $ref: '#/components/schemas/AuthorizationDecision' }
                  meta: { type: object, properties: { request_id: { type: string } } }
        403:
          $ref: '#/components/responses/AuthorizationDenied'
        422:
          $ref: '#/components/responses/ValidationFailed'
  /api/v1/booking/reservations:
    get:
      operationId: listReservations
      summary: 'Cursor-paginated caller reservations (optional section filter).'
      x-gate: ownership
      x-scope: 'booking:read'
      parameters:
        -
          $ref: '#/components/parameters/TenantId'
        -
          $ref: '#/components/parameters/Limit'
        -
          $ref: '#/components/parameters/Cursor'
        -
          name: section
          in: query
          required: false
          schema:
            type: string
            enum:
              - upcoming
              - active
              - completed
              - cancelled
      responses:
        200:
          description: Reservations.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data: { type: array }
                  meta: { $ref: '#/components/schemas/ListMeta' }
  '/api/v1/booking/reservations/{id}':
    get:
      operationId: getReservation
      summary: 'Read one reservation with live actions (404 across owners).'
      x-gate: ownership
      x-scope: 'booking:read'
      parameters:
        -
          $ref: '#/components/parameters/TenantId'
        -
          name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Ulid'
      responses:
        200:
          description: Reservation.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data: { type: object, required: [id, object, status, version, actions] }
                  meta: { type: object, required: [request_id], properties: { request_id: { type: string } } }
        404:
          $ref: '#/components/responses/NotFound'
  '/api/v1/booking/reservations/{id}/history':
    get:
      operationId: getReservationHistory
      summary: 'Append-only transition timeline.'
      x-gate: ownership
      x-scope: 'booking:read'
      parameters:
        -
          $ref: '#/components/parameters/TenantId'
        -
          name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Ulid'
      responses:
        200:
          description: Timeline.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data: { type: array }
                  meta: { type: object, required: [request_id], properties: { request_id: { type: string } } }
        404:
          $ref: '#/components/responses/NotFound'
  '/api/v1/booking/reservations/{id}/reviews':
    post:
      operationId: reviewReservation
      summary: 'Review a COMPLETED booking (one per booking).'
      x-gate: ownership
      parameters:
        -
          $ref: '#/components/parameters/TenantId'
        -
          name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Ulid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - rating
      responses:
        201:
          description: 'Created review.'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data: { type: object, required: [id, object, booking_id, rating] }
                  meta: { type: object, required: [request_id], properties: { request_id: { type: string } } }
        404:
          $ref: '#/components/responses/NotFound'
  '/api/v1/booking/reservations/{id}:cancel':
    post:
      operationId: cancelReservation
      summary: 'Cancel (idempotent on CANCELLED, 409 off-lifecycle).'
      x-gate: ownership
      parameters:
        -
          $ref: '#/components/parameters/TenantId'
        -
          name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Ulid'
      responses:
        200:
          description: 'Cancelled reservation.'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data: { type: object, required: [id, object, status, version, actions] }
                  meta: { type: object, required: [request_id], properties: { request_id: { type: string } } }
        404:
          $ref: '#/components/responses/NotFound'
  '/api/v1/booking/reservations/{id}:reschedule':
    post:
      operationId: rescheduleReservation
      summary: 'Reschedule with optimistic version + overlap check.'
      x-gate: ownership
      parameters:
        -
          $ref: '#/components/parameters/TenantId'
        -
          name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Ulid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - new_start_time
                - version
      responses:
        200:
          description: 'Rescheduled reservation.'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data: { type: object, required: [id, object, status, version, actions] }
                  meta: { type: object, required: [request_id], properties: { request_id: { type: string } } }
        404:
          $ref: '#/components/responses/NotFound'
  /api/v1/booking/reviews:
    get:
      operationId: listBookingReviews
      summary: 'Cursor-paginated caller reviews.'
      x-gate: ownership
      parameters:
        -
          $ref: '#/components/parameters/TenantId'
        -
          $ref: '#/components/parameters/Limit'
        -
          $ref: '#/components/parameters/Cursor'
      responses:
        200:
          description: Reviews.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data: { type: array }
                  meta: { $ref: '#/components/schemas/ListMeta' }
  '/api/v1/booking/reviews/{id}':
    delete:
      operationId: deleteBookingReview
      summary: 'Remove own review.'
      x-gate: ownership
      parameters:
        -
          $ref: '#/components/parameters/TenantId'
        -
          name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Ulid'
      responses:
        200:
          description: Removed.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data: { type: object, required: [object, deleted] }
                  meta: { type: object, required: [request_id], properties: { request_id: { type: string } } }
        404:
          $ref: '#/components/responses/NotFound'
  /api/v1/catalog/items:
    get:
      operationId: listCatalogItems
      summary: 'Cursor-paginated catalog items (optional status filter).'
      x-gate: ownership
      x-scope: 'catalog:read'
      parameters:
        -
          $ref: '#/components/parameters/TenantId'
        -
          $ref: '#/components/parameters/Limit'
        -
          $ref: '#/components/parameters/Cursor'
      responses:
        200:
          description: 'Item list.'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data: { type: array }
                  meta: { $ref: '#/components/schemas/ListMeta' }
    post:
      operationId: createCatalogItem
      summary: 'Create a draft catalog item (SKU unique per tenant).'
      x-permission: 'catalog:item:manage'
      parameters:
        -
          $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - sku
                - name
      responses:
        201:
          description: 'Draft item.'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data: { type: object, required: [id, object, sku, name, status] }
                  meta: { type: object, required: [request_id], properties: { request_id: { type: string } } }
        409:
          description: 'Duplicate SKU.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  '/api/v1/catalog/items/{id}':
    get:
      operationId: getCatalogItem
      summary: 'Read one item (404 across tenant boundaries).'
      x-gate: ownership
      x-scope: 'catalog:read'
      parameters:
        -
          $ref: '#/components/parameters/TenantId'
        -
          name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Ulid'
      responses:
        200:
          description: Item.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data: { type: object, required: [id, object, sku, name, status] }
                  meta: { type: object, required: [request_id], properties: { request_id: { type: string } } }
        404:
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateCatalogItem
      summary: 'Partial update (archived items immutable).'
      x-permission: 'catalog:item:manage'
      parameters:
        -
          $ref: '#/components/parameters/TenantId'
        -
          name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Ulid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                currency:
                  type: string
                price_minor:
                  type: integer
      responses:
        200:
          description: 'Updated item.'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data: { type: object, required: [id, object, sku, name, status] }
                  meta: { type: object, required: [request_id], properties: { request_id: { type: string } } }
        404:
          $ref: '#/components/responses/NotFound'
  '/api/v1/catalog/items/{id}/prices':
    post:
      operationId: setCatalogPrice
      summary: 'Set a price (supersedes the open row for sku/market/currency).'
      x-permission: 'catalog:item:manage'
      parameters:
        -
          $ref: '#/components/parameters/TenantId'
        -
          name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Ulid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - currency
                - price_minor
              properties:
                currency:
                  type: string
                price_minor:
                  type: integer
                market:
                  type: string
      responses:
        201:
          description: 'Price row.'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data: { type: object, required: [id, object, sku, currency, price_minor] }
                  meta: { type: object, required: [request_id], properties: { request_id: { type: string } } }
        404:
          $ref: '#/components/responses/NotFound'
  '/api/v1/catalog/items/{id}:archive':
    post:
      operationId: archiveCatalogItem
      summary: 'Archive an item (terminal state).'
      x-permission: 'catalog:item:manage'
      parameters:
        -
          $ref: '#/components/parameters/TenantId'
        -
          name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Ulid'
      responses:
        200:
          description: 'Archived item.'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data: { type: object, required: [id, object, sku, name, status] }
                  meta: { type: object, required: [request_id], properties: { request_id: { type: string } } }
        404:
          $ref: '#/components/responses/NotFound'
  '/api/v1/catalog/items/{id}:publish':
    post:
      operationId: publishCatalogItem
      summary: 'Publish a draft (explicit verb, never a flag flip).'
      x-permission: 'catalog:item:manage'
      parameters:
        -
          $ref: '#/components/parameters/TenantId'
        -
          name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Ulid'
      responses:
        200:
          description: 'Active item.'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data: { type: object, required: [id, object, sku, name, status] }
                  meta: { type: object, required: [request_id], properties: { request_id: { type: string } } }
  /api/v1/catalog/quote:
    post:
      operationId: quoteCatalogPrices
      summary: 'Deterministic quote (unknown SKUs fail the whole quote).'
      x-gate: ownership
      parameters:
        -
          $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - currency
                - lines
              properties:
                currency:
                  type: string
                lines:
                  type: array
                  items: { type: object, required: [sku, quantity] }
      responses:
        200:
          description: 'Quote totals in minor units.'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data: { type: object, required: [object, lines, total_minor, currency] }
                  meta: { type: object, required: [request_id], properties: { request_id: { type: string } } }
        422:
          $ref: '#/components/responses/ValidationFailed'
        409:
          description: 'Archived items are immutable.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/customers/activity:
    get:
      operationId: listCustomerActivity
      summary: 'Cursor-paginated account history (optional kind filter).'
      x-gate: ownership
      parameters:
        -
          $ref: '#/components/parameters/TenantId'
        -
          $ref: '#/components/parameters/Limit'
        -
          $ref: '#/components/parameters/Cursor'
        -
          name: kind
          in: query
          required: false
          schema:
            type: string
      responses:
        200:
          description: 'Activity items.'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data: { type: array }
                  meta: { $ref: '#/components/schemas/ListMeta' }
  /api/v1/customers/addresses:
    get:
      operationId: listCustomerAddresses
      summary: 'Cursor-paginated caller address book.'
      x-gate: ownership
      parameters:
        -
          $ref: '#/components/parameters/TenantId'
        -
          $ref: '#/components/parameters/Limit'
        -
          $ref: '#/components/parameters/Cursor'
      responses:
        200:
          description: Addresses.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data: { type: array }
                  meta: { $ref: '#/components/schemas/ListMeta' }
    post:
      operationId: createCustomerAddress
      summary: 'Add an address (cap 20 per customer).'
      x-gate: ownership
      parameters:
        -
          $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - label
                - line1
                - city
                - state
                - postal_code
      responses:
        201:
          description: 'Created address.'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data: { type: object, required: [id, object] }
                  meta: { type: object, required: [request_id], properties: { request_id: { type: string } } }
  '/api/v1/customers/addresses/{id}':
    patch:
      operationId: updateCustomerAddress
      summary: 'Update own address.'
      x-gate: ownership
      parameters:
        -
          $ref: '#/components/parameters/TenantId'
        -
          name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Ulid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        200:
          description: 'Updated address.'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data: { type: object, required: [id, object] }
                  meta: { type: object, required: [request_id], properties: { request_id: { type: string } } }
        404:
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteCustomerAddress
      summary: 'Delete own address (default promotes a successor).'
      x-gate: ownership
      parameters:
        -
          $ref: '#/components/parameters/TenantId'
        -
          name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Ulid'
      responses:
        200:
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data: { type: object, required: [object, deleted] }
                  meta: { type: object, required: [request_id], properties: { request_id: { type: string } } }
        404:
          $ref: '#/components/responses/NotFound'
  '/api/v1/customers/addresses/{id}:default':
    post:
      operationId: defaultCustomerAddress
      summary: 'Swap the default address.'
      x-gate: ownership
      parameters:
        -
          $ref: '#/components/parameters/TenantId'
        -
          name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Ulid'
      responses:
        200:
          description: 'New default.'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data: { type: object, required: [id, object] }
                  meta: { type: object, required: [request_id], properties: { request_id: { type: string } } }
        404:
          $ref: '#/components/responses/NotFound'
  /api/v1/customers/auth/login:
    post:
      operationId: loginCustomer
      summary: 'Verify login code (200 + token; deactivated is 403).'
      x-gate: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - tenant_id
                - challenge_id
                - code
      responses:
        200:
          description: 'Authenticated; HMAC actor token issued.'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data: { type: object, required: [object, token, expires_at, tenant_id, actor] }
                  meta: { type: object, required: [request_id], properties: { request_id: { type: string } } }
        401:
          $ref: '#/components/responses/Unauthenticated'
  /api/v1/customers/auth/logout:
    post:
      operationId: logoutCustomer
      summary: 'Best-effort logout (client discards the bearer).'
      x-gate: ownership
      parameters:
        -
          $ref: '#/components/parameters/TenantId'
      responses:
        200:
          description: 'Signed out.'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data: { type: object, required: [object, signed_out] }
                  meta: { type: object, required: [request_id], properties: { request_id: { type: string } } }
  /api/v1/customers/auth/otp:
    post:
      operationId: requestCustomerOtp
      summary: 'Issue an OTP challenge (public, throttled, no oracle).'
      x-gate: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - tenant_id
                - purpose
                - identity
      responses:
        202:
          description: 'Challenge issued (identical for unknown identities).'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data: { type: object, required: [object, challenge_id, expires_in] }
                  meta: { type: object, required: [request_id], properties: { request_id: { type: string } } }
  /api/v1/customers/auth/signup:
    post:
      operationId: signupCustomer
      summary: 'Start signup (account is created at verify, not here).'
      x-gate: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - tenant_id
                - phone
                - name
      responses:
        202:
          description: 'Signup challenge issued.'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data: { type: object, required: [object, challenge_id, expires_in] }
                  meta: { type: object, required: [request_id], properties: { request_id: { type: string } } }
  /api/v1/customers/auth/verify:
    post:
      operationId: verifyCustomerSignup
      summary: 'Verify signup code (creates user, membership, profile; 201 + token).'
      x-gate: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - tenant_id
                - challenge_id
                - code
      responses:
        201:
          description: 'Account created; HMAC actor token issued.'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
