          description: 'Updated product.'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data: { type: object, required: [id, vendor_id, sku, name, status] }
                  meta: { type: object, required: [request_id], properties: { request_id: { type: string } } }
        403:
          $ref: '#/components/responses/AuthorizationDenied'
        404:
          $ref: '#/components/responses/NotFound'
        409:
          description: 'state_forbidden — archived items are immutable.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        422:
          $ref: '#/components/responses/ValidationFailed'
components:
  parameters:
    TenantId:
      name: X-Tenant-Id
      in: header
      required: true
      schema:
        type: string
        pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
      description: 'Tenant ULID; required on every tenant-scoped call.'
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
      description: 'Opaque base64 cursor; offset pagination is banned.'
  schemas:
    Ulid:
      type: string
      pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
    Timestamp:
      type: string
      format: date-time
      example: '2026-08-24T10:15:30.123Z'
    Money:
      type: object
      required:
        - amount
        - currency
      properties:
        amount:
          type: string
          pattern: '^-?[0-9]+\.[0-9]{2}$'
          example: '15499.00'
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          example: INR
    ErrorEnvelope:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
            - request_id
          properties:
            code:
              type: string
              example: permission_missing
            message:
              type: string
            details:
              type: object
            request_id:
              type: string
    ListMeta:
      type: object
      required:
        - request_id
        - page
      properties:
        request_id:
          type: string
        page:
          type: object
          required:
            - limit
            - has_more
          properties:
            limit:
              type: integer
            has_more:
              type: boolean
            next_cursor:
              type: string
              nullable: true
  responses:
    Unauthenticated:
      description: 'Missing, invalid, or expired credential (no oracle — identical for all OTP failures).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    AuthorizationDenied:
      description: 'Missing permission or scope.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ValidationFailed:
      description: 'Semantic validation failure.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: 'State or idempotency conflict.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: 'Absent or outside tenant scope (no existence leakage).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
