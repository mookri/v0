          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyEnvelope'
        403:
          $ref: '#/components/responses/AuthorizationDenied'
        404:
          $ref: '#/components/responses/NotFound'
        409:
          $ref: '#/components/responses/Conflict'
        422:
          $ref: '#/components/responses/ValidationFailed'
  '/api/v1/policies/{policy}:activate':
    post:
      operationId: activatePolicy
      summary: 'Transition draft|disabled -> active'
      x-permission: 'platform:policy:configure'
      parameters:
        -
          $ref: '#/components/parameters/TenantId'
        -
          name: policy
          in: path
          required: true
