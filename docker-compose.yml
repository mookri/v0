# Local platform ( compose-gated, opt-in )
#
# Usage: docker compose up -d postgres redis
# Nothing in the repo requires these today — memory adapters are the
# default. Each binding (outbox store, session store, event bus, search
# index) moves behind its port in a separate, reversible commit.
# Start/stop never touches code or data contracts.
#
# Ops note (F1): the Laravel app ships no container image here — the
# queue worker and scheduler run on the host (deploy runbook §2/§2.1,
# platform-navdhya/docs/22-runbooks/deploy.md), so compose carries no
# worker service.

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: navdhya
      POSTGRES_PASSWORD: navdhya
      POSTGRES_DB: navdhya
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U navdhya"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
