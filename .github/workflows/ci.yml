# Navdhya Platform API — CI
#
# ACTIVATION: this file runs the day platform-navdhya becomes its own repo
# (workflows execute from the repo-root .github only). Until then it is the
# executable specification of backend CI: run the same steps locally.
#
# Local equivalents:
#   composer pint -- --test && composer phpstan && php artisan test
#   php artisan api:compose --check && php artisan platform:doctor --json

name: platform-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ENV: testing
  APP_KEY: base64:dummykeyforcionly00000000000000000000=
  DB_CONNECTION: central
  CENTRAL_DB_DRIVER: mysql
  CENTRAL_DB_HOST: 127.0.0.1
  CENTRAL_DB_PORT: 3306
  CENTRAL_DB_DATABASE: navdhya_central_test
  CENTRAL_DB_USERNAME: root
  CENTRAL_DB_PASSWORD: root
  TENANT_DB_DRIVER: mysql
  TENANT_DB_HOST: 127.0.0.1
  TENANT_DB_PORT: 3306
  TENANT_DB_DATABASE: navdhya_tenant_test
  TENANT_DB_USERNAME: root
  TENANT_DB_PASSWORD: root

jobs:
  validate:
    name: Validate (lint + static + contract + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: navdhya_central_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: mbstring, pdo_mysql, sodium, intl, redis
          coverage: none

      - name: Install
        run: composer install --no-progress --prefer-dist --no-interaction

      - name: Prepare tenant test database
        run: mysql -h 127.0.0.1 -uroot -proot -e "CREATE DATABASE IF NOT EXISTS navdhya_tenant_test;"

      - name: Lint (Pint, test mode)
        run: ./vendor/bin/pint --test

      - name: Static analysis (PHPStan)
        run: ./vendor/bin/phpstan analyse --no-progress

      - name: Contract composition gate
        run: php artisan api:compose --check

      - name: Tests (MySQL 8, both connections)
        run: php artisan test

      - name: Self-diagnosis
        run: php artisan platform:doctor --json
