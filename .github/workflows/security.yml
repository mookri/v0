# Navdhya security ring — secrets, dependencies, SAST, supply chain.
#
# Required check: `security-gate`.
#
# Capability note (docs/CI-CD-PIPELINE-PLAN.md §8.2): this repository is private.
# CodeQL, dependency-review and native secret scanning require GitHub Advanced
# Security. Every GHAS-only job is therefore gated behind
# `vars.CI_ADVANCED_SECURITY == 'true'`, and free substitutes (gitleaks,
# `pnpm audit`, Semgrep OSS, Trivy, SBOM) always run. A plan limitation must
# never look like a clean security posture — the plan records the gap instead.

name: security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Sunday 21:00 UTC = Monday 02:30 IST (off-peak for the deploy host).
    - cron: '0 21 * * 0'
  workflow_call:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CI: 'true'
  FORCE_COLOR: '0'

jobs:
  # ── 1 · secrets (full history on schedule, diff-aware on PRs) ─────────────
  secrets:
    name: secrets
    runs-on: ubuntu-24.04
    # Full-history scan of ~380 commits. 8 minutes was not enough once the
    # backend's history joined this repository.
    timeout-minutes: 15
    permissions:
      # gitleaks enumerates the PR's commits through the API; with only
      # `contents: read` it fails with "Resource not accessible by integration"
      # and never actually scans anything.
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          # Report in the job summary only. Commenting needs
          # `pull-requests: write`, which a fork PR must never receive; without
          # this the action retried a 403 once per finding and the job timed out
          # before it could finish scanning.
          GITLEAKS_ENABLE_COMMENTS: 'false'
          # Only required when the repository is owned by an organisation.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # ── 2 · dependency vulnerabilities (blocking on critical) ─────────────────
  deps:
    name: deps
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Critical advisories in production dependencies (blocking)
        run: pnpm audit --prod --audit-level critical
      - name: Full audit report (artefact, non-blocking)
        if: always()
        # Exit code 1 means "advisories found" and is expected; anything above 1
        # is a tooling failure and must not be swallowed.
        run: |
          set +e
          pnpm audit --json > pnpm-audit.json
          code=$?
          if [ "$code" -gt 1 ]; then
            echo "::error::pnpm audit failed with exit code $code"
            exit "$code"
          fi
          exit 0
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pnpm-audit-${{ github.sha }}
          path: pnpm-audit.json
          if-no-files-found: ignore
          retention-days: 30

  # ── 3 · SAST (soft until the first triage is complete) ────────────────────
  sast:
    name: sast (soft)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Scan (Semgrep OSS)
        # Version is recorded in the job summary so the pin can be frozen in P3.
        # `pipx run` keeps the tool outside the project and off the PATH.
        run: |
          set -euo pipefail
          version=$(pipx run semgrep --version)
          echo "### Semgrep ${version}" >> "$GITHUB_STEP_SUMMARY"
          pipx run semgrep scan --config=auto --severity=ERROR --error \
            --exclude=node_modules --exclude=vendor --exclude=.next --exclude=.turbo .

  # ── 4 · supply chain (SBOM + filesystem CVE scan) ─────────────────────────
  supply-chain:
    name: supply-chain
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          artifact-name: sbom-${{ github.sha }}.spdx.json
          upload-artifact: true
      - name: Scan filesystem
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          # v1: report only. Blocking once the P4 triage closes (plan §10.2).
          exit-code: '0'
          format: table
          output: trivy-fs.txt
      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-fs-${{ github.sha }}
          path: trivy-fs.txt
          if-no-files-found: ignore
          retention-days: 30

  # ── 5 · GHAS-only jobs (skipped on plans without Advanced Security) ───────
  codeql:
    name: codeql (requires GHAS)
    if: vars.CI_ADVANCED_SECURITY == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v4

  dependency-review:
    name: dependency-review (requires GHAS)
    if: github.event_name == 'pull_request' && vars.CI_ADVANCED_SECURITY == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  # ── Aggregator ────────────────────────────────────────────────────────────
  security-gate:
    name: security-gate
    if: always()
    needs: [secrets, deps, sast, supply-chain, codeql, dependency-review]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Evaluate gate
        env:
          GATE_NEEDS: ${{ toJSON(needs) }}
          GATE_SOFT: sast
          GATE_STRICT: ${{ vars.CI_STRICT }}
        run: node tooling/scripts/ci/gate.mjs
